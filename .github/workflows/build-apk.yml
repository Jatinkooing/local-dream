name: Build and Release airound APK

on:
  push:
    branches:
      - 'master'
      - 'arena/*'
  workflow_dispatch:

jobs:
  build:
    name: Build airound Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Mock QNN Paths for Compilation
        run: |
          sudo mkdir -p /data/qairt/2.39.0.250926/examples/QNN/SampleApp/SampleApp
          sudo mkdir -p /data/qairt/2.39.0.250926/lib/aarch64-android
          sudo mkdir -p /data/qairt/2.39.0.250926/lib/hexagon-v68/unsigned
          sudo mkdir -p /data/qairt/2.39.0.250926/lib/hexagon-v69/unsigned
          sudo mkdir -p /data/qairt/2.39.0.250926/lib/hexagon-v73/unsigned
          sudo mkdir -p /data/qairt/2.39.0.250926/lib/hexagon-v75/unsigned
          sudo mkdir -p /data/qairt/2.39.0.250926/lib/hexagon-v79/unsigned
          sudo mkdir -p /data/qairt/2.39.0.250926/lib/hexagon-v81/unsigned
          sudo touch /data/qairt/2.39.0.250926/lib/aarch64-android/libQnnHtp.so
          sudo touch /data/qairt/2.39.0.250926/lib/aarch64-android/libQnnSystem.so
          sudo touch /data/qairt/2.39.0.250926/lib/aarch64-android/libQnnHtpV68Stub.so
          sudo touch /data/qairt/2.39.0.250926/lib/aarch64-android/libQnnHtpV69Stub.so
          sudo touch /data/qairt/2.39.0.250926/lib/aarch64-android/libQnnHtpV73Stub.so
          sudo touch /data/qairt/2.39.0.250926/lib/aarch64-android/libQnnHtpV75Stub.so
          sudo touch /data/qairt/2.39.0.250926/lib/aarch64-android/libQnnHtpV79Stub.so
          sudo touch /data/qairt/2.39.0.250926/lib/aarch64-android/libQnnHtpV81Stub.so

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate Built APKs
        run: |
          mkdir -p dist
          cp $(find app/build/outputs/apk/ -name "*.apk") dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airound-apks
          path: dist/*.apk